[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "word-mcp"
version = "0.1.0"
description = "MCP server for live editing of documents open in Microsoft Word on Windows (COM)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "GongRzhe", email = "gongrzhe@gmail.com"},
    {name = "Yüce Karapazar"},
    {name = "HurleySk"},
]
keywords = ["mcp", "word", "microsoft-word", "com-automation", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.5,<5",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["word: needs a running Microsoft Word"]
addopts = "-m 'not word'"

[project.urls]
"Homepage" = "https://github.com/HurleySk/word-mcp"
"Upstream" = "https://github.com/ykarapazar/word-mcp-live"

[tool.hatch.build.targets.wheel]
packages = ["word_mcp"]

[project.scripts]
word-mcp = "word_mcp.server:run"
